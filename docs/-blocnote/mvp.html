async function getFile() {
	const [fileHandle] = await window.showOpenFilePicker()
	const file = await fileHandle.getFile()
	return await file.text()
}
async function getCode() {
	const [fileHandle] = await window.showOpenFilePicker({
		types: [{
			description: "javascript",
			accept: {"text/javascript": [".js", ".mjs"]}
		}],
		//excludeAcceptAllOptions: true
	})
	const file = await fileHandle.getFile()
	return file.text() // .name;
}
function dateStamp() {
	const d = new Date()
	return d.getFullYear() + (d.getMonth()+1).toString().padStart(2,'0') + d.getDate()
}
/**
 * @param {string|BufferSource|Blob} content
 * @param {} fileHandle
 * @return void
 */
async function saveFile(content, fileHandle_ = window.showSaveFilePicker({
		suggestedName: dateStamp() + 'notebook.js',
		types: [{
			description: "javascript",
			accept: {"text/javascript": [".js", ".mjs"]}
		}],
		//excludeAcceptAllOptions: true,
		//multiple: false
	})) {
	const fileHandle = await fileHandle_
	const wStream = await fileHandle.createWritable()
	await wStream.write(content)
	await wStream.close()
}

window.cmd = {saveFile, getFile, getCode}
